license="${mod_license}"
issueTrackerURL="https://github.com/hibiscus-software/hibiscus-lib/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Hibiscus Software"
# Square icon beside the name in the mod list; wide banner at the top of the info panel. Both are pixel art, so no blur.
iconFile="hibiscuslib_icon.png"
bannerFile="hibiscuslib_banner.png"
displayURL="https://github.com/hibiscus-software/hibiscus-lib"
description='''
The shared library for Hibiscus mods: the inventory button bar, a themeable GUI toolkit, config and networking helpers, and the Teams API.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="CLIENT"
