license="${mod_license}"
issueTrackerURL="https://github.com/hibiscus-software/hibiscuslib/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Hibiscus Software"
displayURL="https://github.com/hibiscus-software/hibiscuslib"
description='''
The shared library for Hibiscus mods: the inventory button bar, a themeable GUI toolkit, config and networking helpers, and the Teams API.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="CLIENT"
