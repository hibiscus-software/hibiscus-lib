name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Compiles, checks the API's Javadoc and builds the mod and API jars.
      - name: Build with Gradle
        run: ./gradlew build

      # The same game tests release.yml runs, so a failure shows up here rather than on a pushed tag.
      - name: Run game tests
        run: ./gradlew runGameTestServer

      # The classes just compiled, run on the oldest NeoForge in neo_version_range without recompiling, so a call
      # that newer builds changed shows up as a linkage error. JEI doesn't load on 26.3.0.0-beta, hence no_jei.
      # The Minecraft workspace is set up afresh, without the build or configuration cache: otherwise the one made
      # for neo_version comes back from the cache (deleting build/neoForm alone isn't enough), and the run fails with
      # a NoClassDefFoundError for a newer NeoForge interface.
      - name: Run game tests on the oldest NeoForge
        run: |
          rm -rf build/neoForm
          ./gradlew runGameTestServer -x compileJava -x compileApiJava -Pneo_version=26.3.0.0-beta -Pno_jei --no-configuration-cache --no-build-cache

      # Every build's jars (the mod and the API), downloadable from the run's Summary page for 30 days.
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: hibiscuslib-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
